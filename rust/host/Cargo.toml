[package]
name = "stepthumbnail-host"
version = "0.4.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "StepThumbs"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
stepthumbnail-common = { path = "../common" }
serde_json.workspace = true
windows-sys = { workspace = true, features = ["Win32_Globalization", "Win32_System_Environment", "Win32_System_Performance", "Win32_System_WindowsProgramming"] }

[build-dependencies]
png = "0.18"
